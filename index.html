<style>
  :root {
    --chocolate-950: #241209;
    --chocolate-800: #3B2418;
    --chocolate-700: #4A2E1A;
    --chocolate-600: #6B4226;
    --amber-600: #D9800F;
    --amber-500: #F0971E;
    --amber-400: #F5AC3C;
    --amber-200: #FBD79B;
    --amber-100: #FCE8C8;
    --creme-50: #FBF3E7;
    --creme-0: #FFFCF7;
    --ink: #2A1810;
    --ink-soft: #7A6552;
    --ink-faint: #A8927C;
    --line: #E8D9C3;
    --alert: #A6402C;
    --alert-bg: #F7E4DE;
    --sage: #5F7F4E;
    --shadow-warm: 0 24px 60px -24px rgba(36, 18, 9, 0.35);
    --shadow-soft: 0 10px 30px -14px rgba(36, 18, 9, 0.22);
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    background: var(--creme-50);
    color: var(--ink);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 40px;
  }

  .fonte-display { font-family: 'Fraunces', serif; }

  header {
    background: linear-gradient(160deg, var(--chocolate-800), var(--chocolate-950));
    color: white;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 50;
    box-shadow: var(--shadow-soft);
  }

  header img { width: 38px; height: 38px; object-fit: contain; }
  header h1 { font-family: 'Fraunces', serif; font-size: 17px; font-weight: 600; margin: 0; }
  header .sub { font-size: 11px; color: var(--amber-200); margin-top: 1px; }

  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 18px 16px 0;
  }

  .cartao {
    background: var(--creme-0);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 20px 18px;
    margin-bottom: 16px;
    box-shadow: var(--shadow-soft);
  }

  .eyebrow {
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--amber-600);
    margin: 0 0 3px;
  }

  h2.titulo-cartao {
    font-family: 'Fraunces', serif;
    font-size: 19px;
    font-weight: 600;
    margin: 0 0 14px;
    color: var(--chocolate-700);
  }

  label.rotulo {
    display: block;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--ink-soft);
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }

  input[type="text"] {
    width: 100%;
    padding: 15px 16px;
    border: 1.5px solid var(--line);
    border-radius: 12px;
    font-size: 16px;
    background: var(--creme-50);
    font-family: inherit;
    color: var(--ink);
  }
  input[type="text"]:focus {
    outline: none;
    border-color: var(--amber-500);
    background: var(--creme-0);
    box-shadow: 0 0 0 4px var(--amber-100);
  }

  .botao-primario, .botao-secundario, .botao-perigo {
    width: 100%;
    padding: 16px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    border: none;
    transition: transform 0.15s var(--ease), box-shadow 0.15s var(--ease), opacity 0.15s var(--ease);
    letter-spacing: 0.3px;
  }

  .botao-primario {
    background: linear-gradient(135deg, var(--amber-500), var(--amber-600));
    color: white;
    box-shadow: 0 10px 24px -10px rgba(217,128,15,0.55);
  }
  .botao-primario:active { transform: scale(0.98); }
  .botao-primario:disabled { opacity: 0.55; }

  .botao-secundario {
    background: var(--chocolate-700);
    color: var(--creme-0);
  }
  .botao-secundario:active { transform: scale(0.98); }

  .botao-perigo {
    background: var(--alert);
    color: white;
    box-shadow: 0 10px 24px -10px rgba(166,64,44,0.5);
  }
  .botao-perigo:active { transform: scale(0.98); }
  .botao-perigo:disabled { opacity: 0.55; }

  .espaco-botao { margin-top: 12px; }

  /* ---- segmented toggle (tipo de venda / tamanho) ---- */

  .segmentado {
    display: flex;
    gap: 8px;
    margin-bottom: 4px;
  }

  .segmento {
    flex: 1;
    padding: 14px 8px;
    text-align: center;
    border-radius: 11px;
    border: 1.5px solid var(--line);
    background: var(--creme-50);
    color: var(--ink-soft);
    font-weight: 700;
    font-size: 13.5px;
    cursor: pointer;
    transition: all 0.15s var(--ease);
    user-select: none;
  }

  .segmento.ativo {
    background: linear-gradient(135deg, var(--amber-500), var(--amber-600));
    border-color: var(--amber-600);
    color: white;
    box-shadow: 0 6px 16px -6px rgba(217,128,15,0.55);
  }

  /* ---- chips (itens do cardápio, prato especial, observações) ---- */

  .categoria-titulo {
    font-size: 13px;
    font-weight: 700;
    color: var(--chocolate-700);
    margin: 16px 0 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .categoria-titulo:first-child { margin-top: 0; }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .chip {
    padding: 11px 16px;
    border-radius: 999px;
    border: 1.5px solid var(--line);
    background: var(--creme-50);
    color: var(--ink);
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s var(--ease);
    user-select: none;
  }

  .chip.marcado {
    background: linear-gradient(135deg, var(--amber-500), var(--amber-600));
    border-color: var(--amber-600);
    color: white;
    box-shadow: 0 4px 12px -4px rgba(217,128,15,0.5);
  }

  .chip.rapido {
    background: var(--amber-100);
    border-color: var(--amber-200);
    color: var(--chocolate-700);
  }
  .chip.rapido:active { transform: scale(0.96); }

  .prato-especial-card {
    padding: 14px 16px;
    border-radius: 12px;
    border: 1.5px solid var(--line);
    background: var(--creme-50);
    margin-bottom: 8px;
    cursor: pointer;
    transition: all 0.15s var(--ease);
  }
  .prato-especial-card.marcado {
    background: var(--amber-100);
    border-color: var(--amber-500);
    box-shadow: var(--shadow-soft);
  }
  .prato-especial-card .nome { font-weight: 700; font-size: 14.5px; color: var(--ink); }
  .prato-especial-card .desc { font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; }

  textarea, .campo-obs {
    width: 100%;
    padding: 14px 16px;
    border: 1.5px solid var(--line);
    border-radius: 12px;
    font-size: 14.5px;
    font-family: inherit;
    background: var(--creme-50);
    color: var(--ink);
    resize: none;
    min-height: 52px;
  }
  textarea:focus {
    outline: none;
    border-color: var(--amber-500);
    background: var(--creme-0);
  }

  /* ---- resumo ---- */

  .linha-resumo {
    padding: 14px 0;
    border-top: 1px solid var(--line);
  }
  .linha-resumo:first-child { border-top: none; padding-top: 0; }

  .linha-resumo .titulo-prato {
    display: flex;
    justify-content: space-between;
    font-weight: 700;
    font-size: 15px;
    color: var(--ink);
    margin-bottom: 3px;
  }
  .linha-resumo .componentes {
    font-size: 13px;
    color: var(--ink-soft);
  }
  .linha-resumo .obs {
    font-size: 13px;
    color: var(--alert);
    margin-top: 2px;
  }
  .linha-resumo .acoes {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }
  .btn-mini {
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 12.5px;
    font-weight: 700;
    border: 1.5px solid var(--line);
    background: var(--creme-0);
    color: var(--ink-soft);
    cursor: pointer;
  }
  .btn-mini.editar { border-color: var(--amber-500); color: var(--amber-600); }
  .btn-mini.remover { border-color: var(--alert); color: var(--alert); }

  .total-linha {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding-top: 16px;
    margin-top: 4px;
    border-top: 2px solid var(--line);
  }
  .total-linha .rotulo-total { font-size: 14px; font-weight: 700; color: var(--ink-soft); }
  .total-linha .valor-total { font-family: 'Fraunces', serif; font-size: 26px; font-weight: 700; color: var(--chocolate-700); }

  .carregando { font-size: 13.5px; color: var(--ink-faint); }

  #toast {
    position: fixed;
    bottom: 22px;
    left: 50%;
    transform: translateX(-50%) translateY(24px);
    background: var(--chocolate-800);
    color: var(--creme-0);
    padding: 14px 24px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s var(--ease), transform 0.25s var(--ease);
    box-shadow: var(--shadow-warm);
    border-left: 4px solid var(--amber-500);
    z-index: 100;
    max-width: 90%;
    text-align: center;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.erro { border-left-color: var(--alert); }

  .oculto { display: none !important; }

  /* ===================== CUPOM DE IMPRESSÃO ===================== */

  #reciboImprimir { display: none; }

  @media print {
    @page { size: 48mm auto; margin: 2mm; }

    html, body { background: #FFFFFF !important; }
    body * { visibility: hidden; }
    #reciboImprimir, #reciboImprimir * { visibility: visible; }

    #reciboImprimir {
      display: block !important;
      position: absolute;
      top: 0;
      left: 0;
      width: 48mm;
      font-family: 'Courier New', Courier, monospace;
      color: #000;
    }
  }

  #reciboImprimir .recibo-logo { text-align: center; margin-bottom: 6px; }
  #reciboImprimir .recibo-logo img { width: 78%; filter: grayscale(1) contrast(1.3); }

  #reciboImprimir .recibo-linha {
    border-top: 1px solid #000;
    margin: 6px 0;
  }
  #reciboImprimir .recibo-linha.grossa { border-top-width: 2px; }
  #reciboImprimir .recibo-linha.tracejada { border-top-style: dashed; border-top-width: 1px; }

  #reciboImprimir .recibo-identificador {
    text-align: center;
    font-weight: bold;
    font-size: 15px;
  }
  #reciboImprimir .recibo-datahora {
    text-align: center;
    font-size: 10px;
    color: #444;
    margin-top: 2px;
  }

  #reciboImprimir .recibo-item { margin: 8px 0; }
  #reciboImprimir .recibo-item-topo {
    display: flex;
    justify-content: space-between;
    font-weight: bold;
    font-size: 12.5px;
  }
  #reciboImprimir .recibo-item-sub {
    font-size: 11.5px;
    padding-left: 10px;
    margin-top: 2px;
  }
  #reciboImprimir .recibo-item-tamanho-preco {
    display: flex;
    justify-content: space-between;
    padding-left: 10px;
    font-size: 11.5px;
    margin-top: 2px;
  }

  #reciboImprimir .recibo-total {
    display: flex;
    justify-content: space-between;
    font-weight: bold;
    font-size: 16px;
    margin: 8px 0;
  }

  #reciboImprimir .recibo-rodape {
    text-align: center;
    font-weight: bold;
    font-size: 14px;
    margin-top: 6px;
  }
</style>

    <h1>Caseirinho 261</h1>
    <div class="sub">Fazer pedido</div>
  </div>
</header>

<main>

  <!-- ===== ETAPA 1: IDENTIFICAÇÃO ===== -->
  <section id="etapaIdentificacao" class="cartao">
    <div class="eyebrow">Passo 1</div>
    <h2 class="titulo-cartao">Mesa, balcão ou cliente</h2>
    <label class="rotulo">Identificação do pedido</label>
    <input type="text" id="inputIdentificador" placeholder="Ex: Mesa 5, Balcão, João Silva" autocomplete="off" />
    <div class="espaco-botao">
      <button class="botao-primario" onclick="iniciarPedido()">Iniciar pedido</button>
    </div>
  </section>

  <!-- ===== ETAPA 2: CARDÁPIO ===== -->
  <section id="etapaCardapio" class="oculto">

    <div class="cartao">
      <div class="eyebrow">Passo 2</div>
      <h2 class="titulo-cartao" id="textoIdentificadorTopo"></h2>

      <label class="rotulo">Tipo de venda</label>
      <div class="segmentado" id="segmentoTipoVenda">
        <div class="segmento ativo" data-valor="executivo">Executivo</div>
        <div class="segmento" data-valor="marmitex">Marmitex</div>
        <div class="segmento" data-valor="especial">Especial</div>
      </div>

      <div id="blocoTamanho" class="oculto" style="margin-top:14px;">
        <label class="rotulo">Tamanho</label>
        <div class="segmentado" id="segmentoTamanho">
          <div class="segmento ativo" data-valor="P">P</div>
          <div class="segmento" data-valor="G">G</div>
          <div class="segmento" data-valor="Divisorias">Divisórias</div>
        </div>
      </div>
    </div>

    <div id="blocoMontarPrato" class="cartao">
      <h2 class="titulo-cartao">Monte o prato</h2>
      <div id="cardapioContainer"><span class="carregando">Carregando cardápio…</span></div>
    </div>

    <div id="blocoPratosEspeciais" class="cartao oculto">
      <h2 class="titulo-cartao">Escolha o prato especial</h2>
      <div id="especiaisContainer"><span class="carregando">Carregando pratos especiais…</span></div>
    </div>

    <div class="cartao">
      <h2 class="titulo-cartao">Observação <span style="font-weight:400; font-size:13px; color:var(--ink-faint);">(opcional)</span></h2>
      <div class="chips" id="chipsObservacaoRapida" style="margin-bottom:12px;"></div>
      <textarea id="inputObservacao" placeholder="Só escreva aqui se for algo fora da lista acima" rows="2"></textarea>
    </div>

    <button class="botao-primario" id="btnAdicionarPrato" onclick="adicionarOuSalvarPrato()">Adicionar ao pedido</button>
    <div class="espaco-botao">
      <button class="botao-secundario" onclick="mostrarResumo()">Ver resumo do pedido</button>
    </div>
  </section>

  <!-- ===== ETAPA 3: RESUMO ===== -->
  <section id="etapaResumo" class="oculto">
    <div class="cartao">
      <div class="eyebrow">Passo 3</div>
      <h2 class="titulo-cartao" id="textoIdentificadorResumo"></h2>
      <div id="resumoContainer"></div>
      <div class="total-linha">
        <span class="rotulo-total">Total</span>
        <span class="valor-total" id="textoTotal">R$ 0,00</span>
      </div>
    </div>

    <button class="botao-secundario" onclick="mostrarEtapaCardapio()">Adicionar mais itens</button>
    <div class="espaco-botao">
      <button class="botao-perigo" id="btnFecharPedido" onclick="fecharPedido()">Fechar pedido</button>
    </div>
  </section>

</main>

<script>
  // ===== CONEXÃO COM O SUPABASE =====
  const SUPABASE_URL = 'https://qyjexmrxxvnmkngfjgip.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF5amV4bXJ4eHZubWtuZ2ZqZ2lwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU4NTY0NDMsImV4cCI6MjEwMTQzMjQ0M30.d261NqiJ5CG7KhlLeESBwKjr58fIuLoof_nUnlqQTBY';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const CATEGORIA_LABEL = { proteina: 'Prato principal', massa: 'Massa', acompanhamento: 'Acompanhamento', extra: 'Extra' };
  const CATEGORIA_ORDEM = ['proteina', 'massa', 'acompanhamento', 'extra'];
  const OBSERVACOES_RAPIDAS = ['Sem cebola', 'Sem pimentão', 'Bem passado', 'Ao ponto', 'Molho à parte', 'Sem farofa'];

  // ===== ESTADO =====
  let identificador = '';
  let cardapioHoje = [];
  let pratosEspeciais = [];
  let precoExecutivo = 0;
  let precosMarmitex = {};
  let tipoVendaAtual = 'executivo';
  let tamanhoAtual = 'P';
  let itensSelecionados = new Set();      // ids de menu_items marcados
  let pratoEspecialSelecionadoId = null;
  let carrinho = [];                       // pratos adicionados a este pedido
  let indiceEditando = null;

  // ===== INICIALIZAÇÃO =====
  async function iniciarPedido() {
    const texto = document.getElementById('inputIdentificador').value.trim();
    if (!texto) { mostrarToast('Informe mesa, balcão ou nome do cliente.', true); return; }
    identificador = texto;
    carrinho = [];
    document.getElementById('textoIdentificadorTopo').textContent = 'Pedido: ' + identificador;
    document.getElementById('etapaIdentificacao').classList.add('oculto');
    document.getElementById('etapaResumo').classList.add('oculto');
    document.getElementById('etapaCardapio').classList.remove('oculto');
    resetarFormularioPrato();
    await carregarDadosCardapio();
    montarChipsObservacaoRapida();
  }

  async function carregarDadosCardapio() {
    const [precos, cardapio, especiais] = await Promise.all([
      buscarPrecos(),
      buscarCardapioHoje(),
      buscarPratosEspeciais()
    ]);
    montarCardapio();
    montarPratosEspeciais();
  }

  async function buscarPrecos() {
    const { data: exec } = await sb.from('config_preco').select('preco_executivo').eq('id', 1).single();
    if (exec) precoExecutivo = exec.preco_executivo;

    const { data: tamanhos } = await sb.from('marmitex_tamanhos').select('tamanho,preco');
    if (tamanhos) {
      precosMarmitex = {};
      tamanhos.forEach(t => precosMarmitex[t.tamanho] = t.preco);
    }
  }

  async function buscarCardapioHoje() {
    const { data, error } = await sb.from('cardapio_hoje').select('id,nome,categoria').order('categoria').order('nome');
    if (!error && data) cardapioHoje = data;
  }

  async function buscarPratosEspeciais() {
    const { data, error } = await sb.from('pratos_especiais')
      .select('id,nome,descricao,preco_p,preco_g,preco_divisorias')
      .eq('ativo', true)
      .order('ordem');
    if (!error && data) pratosEspeciais = data;
  }

  // ===== TIPO DE VENDA / TAMANHO (segmentado) =====
  document.getElementById('segmentoTipoVenda').addEventListener('click', (e) => {
    const alvo = e.target.closest('.segmento');
    if (!alvo) return;
    document.querySelectorAll('#segmentoTipoVenda .segmento').forEach(el => el.classList.remove('ativo'));
    alvo.classList.add('ativo');
    tipoVendaAtual = alvo.dataset.valor;
    atualizarVisibilidadePorTipo();
  });

  document.getElementById('segmentoTamanho').addEventListener('click', (e) => {
    const alvo = e.target.closest('.segmento');
    if (!alvo) return;
    document.querySelectorAll('#segmentoTamanho .segmento').forEach(el => el.classList.remove('ativo'));
    alvo.classList.add('ativo');
    tamanhoAtual = alvo.dataset.valor;
  });

  function atualizarVisibilidadePorTipo() {
    const blocoTamanho = document.getElementById('blocoTamanho');
    const blocoMontar = document.getElementById('blocoMontarPrato');
    const blocoEspeciais = document.getElementById('blocoPratosEspeciais');

    if (tipoVendaAtual === 'executivo') {
      blocoTamanho.classList.add('oculto');
      blocoMontar.classList.remove('oculto');
      blocoEspeciais.classList.add('oculto');
    } else if (tipoVendaAtual === 'marmitex') {
      blocoTamanho.classList.remove('oculto');
      blocoMontar.classList.remove('oculto');
      blocoEspeciais.classList.add('oculto');
    } else {
      blocoTamanho.classList.remove('oculto');
      blocoMontar.classList.add('oculto');
      blocoEspeciais.classList.remove('oculto');
    }
  }

  // ===== MONTAGEM DO CARDÁPIO =====
  function montarCardapio() {
    const container = document.getElementById('cardapioContainer');
    container.innerHTML = '';

    let algumItem = false;
    CATEGORIA_ORDEM.forEach(cat => {
      const itens = cardapioHoje.filter(i => i.categoria === cat);
      if (itens.length === 0) return;
      algumItem = true;

      const titulo = document.createElement('div');
      titulo.className = 'categoria-titulo';
      titulo.textContent = CATEGORIA_LABEL[cat] || cat;
      container.appendChild(titulo);

      const chips = document.createElement('div');
      chips.className = 'chips';
      itens.forEach(item => {
        const chip = document.createElement('div');
        chip.className = 'chip' + (itensSelecionados.has(item.id) ? ' marcado' : '');
        chip.textContent = item.nome;
        chip.onclick = () => {
          if (itensSelecionados.has(item.id)) itensSelecionados.delete(item.id);
          else itensSelecionados.add(item.id);
          chip.classList.toggle('marcado');
        };
        chips.appendChild(chip);
      });
      container.appendChild(chips);
    });

    if (!algumItem) {
      container.innerHTML = '<p style="color:var(--alert); font-size:13.5px;">Nenhum item disponível hoje.</p>';
    }
  }

  function montarPratosEspeciais() {
    const container = document.getElementById('especiaisContainer');
    container.innerHTML = '';

    if (pratosEspeciais.length === 0) {
      container.innerHTML = '<p style="color:var(--alert); font-size:13.5px;">Nenhum prato especial disponível hoje.</p>';
      return;
    }

    pratosEspeciais.forEach((prato, index) => {
      if (index === 0 && pratoEspecialSelecionadoId === null) pratoEspecialSelecionadoId = prato.id;
      const card = document.createElement('div');
      card.className = 'prato-especial-card' + (pratoEspecialSelecionadoId === prato.id ? ' marcado' : '');
      card.innerHTML = `<div class="nome">${prato.nome}</div>` + (prato.descricao ? `<div class="desc">${prato.descricao}</div>` : '');
      card.onclick = () => {
        pratoEspecialSelecionadoId = prato.id;
        document.querySelectorAll('.prato-especial-card').forEach(el => el.classList.remove('marcado'));
        card.classList.add('marcado');
      };
      container.appendChild(card);
    });
  }

  function montarChipsObservacaoRapida() {
    const container = document.getElementById('chipsObservacaoRapida');
    container.innerHTML = '';
    OBSERVACOES_RAPIDAS.forEach(texto => {
      const chip = document.createElement('div');
      chip.className = 'chip rapido';
      chip.textContent = texto;
      chip.onclick = () => {
        const campo = document.getElementById('inputObservacao');
        const atual = campo.value.trim();
        campo.value = atual ? atual + ', ' + texto : texto;
      };
      container.appendChild(chip);
    });
  }

  // ===== ADICIONAR / SALVAR PRATO NO CARRINHO =====
  function precoDoPratoEspecial(pratoId, tamanho) {
    const p = pratosEspeciais.find(x => x.id === pratoId);
    if (!p) return 0;
    if (tamanho === 'G') return p.preco_g;
    if (tamanho === 'Divisorias') return p.preco_divisorias;
    return p.preco_p;
  }

  function rotuloTamanho(tamanho) {
    if (tamanho === 'G') return 'G';
    if (tamanho === 'Divisorias') return 'Com divisórias';
    return 'P';
  }

  function adicionarOuSalvarPrato() {
    const observacao = document.getElementById('inputObservacao').value.trim();
    let prato;

    if (tipoVendaAtual === 'especial') {
      if (!pratoEspecialSelecionadoId) { mostrarToast('Escolha um prato especial.', true); return; }
      const especial = pratosEspeciais.find(p => p.id === pratoEspecialSelecionadoId);
      prato = {
        tipoVenda: 'especial',
        tamanho: tamanhoAtual,
        componentes: [],
        pratoEspecialId: especial.id,
        pratoEspecialNome: especial.nome,
        observacao,
        preco: precoDoPratoEspecial(especial.id, tamanhoAtual)
      };
    } else if (tipoVendaAtual === 'marmitex') {
      const componentes = cardapioHoje.filter(i => itensSelecionados.has(i.id));
      if (componentes.length === 0) { mostrarToast('Selecione ao menos um item do prato.', true); return; }
      prato = {
        tipoVenda: 'marmitex',
        tamanho: tamanhoAtual,
        componentes,
        pratoEspecialId: null,
        pratoEspecialNome: null,
        observacao,
        preco: precosMarmitex[tamanhoAtual] || 0
      };
    } else {
      const componentes = cardapioHoje.filter(i => itensSelecionados.has(i.id));
      if (componentes.length === 0) { mostrarToast('Selecione ao menos um item do prato.', true); return; }
      prato = {
        tipoVenda: 'executivo',
        tamanho: null,
        componentes,
        pratoEspecialId: null,
        pratoEspecialNome: null,
        observacao,
        preco: precoExecutivo
      };
    }

    if (indiceEditando !== null) {
      carrinho[indiceEditando] = prato;
      mostrarToast('Prato atualizado.');
    } else {
      carrinho.push(prato);
      mostrarToast('Prato adicionado ao pedido.');
    }

    resetarFormularioPrato();
    montarCardapio();
    montarPratosEspeciais();
  }

  function resetarFormularioPrato() {
    indiceEditando = null;
    document.getElementById('btnAdicionarPrato').textContent = 'Adicionar ao pedido';
    document.getElementById('inputObservacao').value = '';
    itensSelecionados = new Set();
    pratoEspecialSelecionadoId = null;
    tipoVendaAtual = 'executivo';
    tamanhoAtual = 'P';
    document.querySelectorAll('#segmentoTipoVenda .segmento').forEach(el => el.classList.remove('ativo'));
    document.querySelector('#segmentoTipoVenda .segmento[data-valor="executivo"]').classList.add('ativo');
    document.querySelectorAll('#segmentoTamanho .segmento').forEach(el => el.classList.remove('ativo'));
    document.querySelector('#segmentoTamanho .segmento[data-valor="P"]').classList.add('ativo');
    atualizarVisibilidadePorTipo();
  }

  // ===== RESUMO =====
  function descricaoTipoVenda(prato) {
    if (prato.tipoVenda === 'marmitex') return 'Marmitex ' + rotuloTamanho(prato.tamanho);
    if (prato.tipoVenda === 'especial') return prato.pratoEspecialNome + ' — ' + rotuloTamanho(prato.tamanho);
    return 'Executivo';
  }

  function mostrarResumo() {
    if (carrinho.length === 0) { mostrarToast('Adicione ao menos um prato antes de continuar.', true); return; }
    document.getElementById('etapaCardapio').classList.add('oculto');
    document.getElementById('etapaResumo').classList.remove('oculto');
    document.getElementById('textoIdentificadorResumo').textContent = 'Pedido: ' + identificador;
    renderizarResumo();
  }

  function mostrarEtapaCardapio() {
    document.getElementById('etapaResumo').classList.add('oculto');
    document.getElementById('etapaCardapio').classList.remove('oculto');
  }

  function renderizarResumo() {
    const container = document.getElementById('resumoContainer');
    container.innerHTML = '';

    carrinho.forEach((prato, index) => {
      const linha = document.createElement('div');
      linha.className = 'linha-resumo';

      const componentesTexto = prato.componentes.length > 0
        ? `<div class="componentes">${prato.componentes.map(c => c.nome).join(', ')}</div>` : '';
      const obsTexto = prato.observacao ? `<div class="obs">Obs: ${prato.observacao}</div>` : '';

      linha.innerHTML = `
        <div class="titulo-prato"><span>${descricaoTipoVenda(prato)}</span><span>R$ ${prato.preco.toFixed(2)}</span></div>
        ${componentesTexto}
        ${obsTexto}
        <div class="acoes">
          <button class="btn-mini editar">Editar</button>
          <button class="btn-mini remover">Remover</button>
        </div>
      `;

      linha.querySelector('.editar').onclick = () => editarPrato(index);
      linha.querySelector('.remover').onclick = () => removerPrato(index);
      container.appendChild(linha);
    });

    const total = carrinho.reduce((soma, p) => soma + p.preco, 0);
    document.getElementById('textoTotal').textContent = 'R$ ' + total.toFixed(2);
  }

  function editarPrato(index) {
    const prato = carrinho[index];
    indiceEditando = index;

    document.getElementById('etapaResumo').classList.add('oculto');
    document.getElementById('etapaCardapio').classList.remove('oculto');

    tipoVendaAtual = prato.tipoVenda;
    tamanhoAtual = prato.tamanho || 'P';
    itensSelecionados = new Set(prato.componentes.map(c => c.id));
    pratoEspecialSelecionadoId = prato.pratoEspecialId;

    document.querySelectorAll('#segmentoTipoVenda .segmento').forEach(el => {
      el.classList.toggle('ativo', el.dataset.valor === tipoVendaAtual);
    });
    document.querySelectorAll('#segmentoTamanho .segmento').forEach(el => {
      el.classList.toggle('ativo', el.dataset.valor === tamanhoAtual);
    });
    atualizarVisibilidadePorTipo();
    montarCardapio();
    montarPratosEspeciais();
    document.getElementById('inputObservacao').value = prato.observacao || '';
    document.getElementById('btnAdicionarPrato').textContent = 'Salvar alteração';
  }

  function removerPrato(index) {
    carrinho.splice(index, 1);
    if (carrinho.length === 0) {
      mostrarEtapaCardapio();
    } else {
      renderizarResumo();
    }
  }

  // ===== FECHAR PEDIDO =====
  // ===== CUPOM DE IMPRESSÃO =====

  function montarReciboEImprimir(identificadorPedido, itensCarrinho, totalPedido) {
    document.getElementById('reciboIdentificador').textContent = identificadorPedido;

    const agora = new Date();
    const dataFormatada = agora.toLocaleDateString('pt-BR');
    const horaFormatada = agora.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    document.getElementById('reciboDataHora').textContent = dataFormatada + '  ' + horaFormatada;

    const container = document.getElementById('reciboItens');
    container.innerHTML = '';

    itensCarrinho.forEach((prato, index) => {
      const item = document.createElement('div');
      item.className = 'recibo-item';

      if (prato.tipoVenda === 'especial') {
        // Nome do prato especial pode ser longo — fica sozinho na linha,
        // com o [ ] junto (é um item só, sem componentes pra desmembrar).
        const topo = document.createElement('div');
        topo.className = 'recibo-item-topo';
        topo.innerHTML = `<span>[ ] ${prato.pratoEspecialNome}</span>`;
        item.appendChild(topo);

        const tamanhoPreco = document.createElement('div');
        tamanhoPreco.className = 'recibo-item-tamanho-preco';
        tamanhoPreco.innerHTML = `<span>${rotuloTamanho(prato.tamanho)}</span><span>R$ ${prato.preco.toFixed(2).replace('.', ',')}</span>`;
        item.appendChild(tamanhoPreco);
      } else {
        const topo = document.createElement('div');
        topo.className = 'recibo-item-topo';
        topo.innerHTML = `<span>${descricaoTipoVenda(prato)}</span><span>R$ ${prato.preco.toFixed(2).replace('.', ',')}</span>`;
        item.appendChild(topo);

        // Cada componente vira sua própria linha com [ ], pra cozinha marcar um por um.
        prato.componentes.forEach(c => {
          const linhaComponente = document.createElement('div');
          linhaComponente.className = 'recibo-item-sub';
          linhaComponente.textContent = '[ ] ' + c.nome;
          item.appendChild(linhaComponente);
        });
      }

      if (prato.observacao) {
        const obs = document.createElement('div');
        obs.className = 'recibo-item-sub';
        obs.textContent = 'Obs: ' + prato.observacao;
        item.appendChild(obs);
      }

      container.appendChild(item);

      if (index < itensCarrinho.length - 1) {
        const linha = document.createElement('div');
        linha.className = 'recibo-linha tracejada';
        container.appendChild(linha);
      }
    });

    document.getElementById('reciboTotalValor').textContent = 'R$ ' + totalPedido.toFixed(2).replace('.', ',');

    setTimeout(() => window.print(), 300);
  }

  async function fecharPedido() {
    const btn = document.getElementById('btnFecharPedido');
    btn.disabled = true;
    btn.textContent = 'Enviando…';

    try {
      const total = carrinho.reduce((s, p) => s + p.preco, 0);

      const { data: pedido, error: erroPedido } = await sb.from('orders')
        .insert({ identificador, status: 'fechado', total })
        .select()
        .single();
      if (erroPedido) throw erroPedido;

      for (const prato of carrinho) {
        const { data: pratoSalvo, error: erroPrato } = await sb.from('order_pratos')
          .insert({
            order_id: pedido.id,
            tipo_venda: prato.tipoVenda,
            tamanho: prato.tamanho,
            preco_unitario: prato.preco,
            observacao: prato.observacao,
            prato_especial_id: prato.pratoEspecialId,
            prato_especial_nome: prato.pratoEspecialNome
          })
          .select()
          .single();
        if (erroPrato) throw erroPrato;

        if (prato.componentes.length > 0) {
          const itens = prato.componentes.map(c => ({
            order_prato_id: pratoSalvo.id,
            menu_item_id: c.id,
            nome: c.nome
          }));
          const { error: erroItens } = await sb.from('order_prato_itens').insert(itens);
          if (erroItens) throw erroItens;
        }
      }

      mostrarToast('Pedido enviado para a cozinha!');
      montarReciboEImprimir(identificador, carrinho, total);

      setTimeout(() => {
        carrinho = [];
        identificador = '';
        document.getElementById('inputIdentificador').value = '';
        document.getElementById('etapaResumo').classList.add('oculto');
        document.getElementById('etapaCardapio').classList.add('oculto');
        document.getElementById('etapaIdentificacao').classList.remove('oculto');
      }, 1200);

    } catch (err) {
      mostrarToast('Erro ao enviar pedido: ' + err.message, true);
    } finally {
      btn.disabled = false;
      btn.textContent = 'Fechar pedido';
    }
  }

  // ===== TOAST =====
  function mostrarToast(msg, erro) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = erro ? 'show erro' : 'show';
    setTimeout(() => { t.className = t.className.replace('show', '').trim(); }, 2600);
  }
</script>
